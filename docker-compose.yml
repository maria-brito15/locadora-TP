services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20
  restheart:
    image: softinstigate/restheart:9.12.3
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    environment:
      RHO: '/mclient/connection-string->"mongodb://mongo";/mongo/mongo-mounts->[{what:"/locadora",where:"/locadora"}];/http-listener/host->"0.0.0.0";'
volumes:
  mongo-data:
